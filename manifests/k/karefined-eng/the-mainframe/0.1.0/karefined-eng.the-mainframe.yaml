ShortDescription: A private, local-first life management app for desktop and Android
Description: The Mainframe is a private, local-first life management application built with Tauri v2 (Rust backend) and React + TypeScript + Tailwind CSS (frontend). It helps you manage 5 life domains: Acquisitions, Build Ideas, Certifications, Goals, and Ventures - all stored locally in SQLite with optional LAN snapshot sync.
